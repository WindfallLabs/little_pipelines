[project]
name = "little-pipelines"
version = "0.1.0"
description = "Data processing pipeline and task library."
readme = "README.md"
authors = [
    { name = "Garin Wally", email = "garwall101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "rich>=15.0.0",
    "tzlocal>=5.4.4",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "furo>=2025.12.19",
    "genbadge[coverage]>=1.1.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.13.7",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
