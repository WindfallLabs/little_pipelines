[project]
name = "little-pipelines"
version = "0.1.0"
description = "Data processing pipeline and task library."
readme = "README.md"
authors = [
    { name = "Garin Wally", email = "garwall101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pytest>=9.0.3",
]
